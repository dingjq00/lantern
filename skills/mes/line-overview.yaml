# MES 单条产线概览
name: mes.line.overview
description: >
  获取单条产线的生产概览。返回产线基本信息（编号/名称/别名）、
  该产线关联的配方数量、最近班次工单的状态分布。
  支持按产线编号或名称查询，名称模糊匹配有多个结果时列出供选择。
  适用于"乳化线怎么样""3号手工线概况""称量线最近的工单"等产线视角问题。
version: "1.0"
system: mes
type: simple
maps_to: mes.line.overview

domains:
  - production

operation: overview

input_schema:
  properties:
    lineCode:
      type: string
      description: 产线编号，如"3101""3201""3110"
    lineName:
      type: string
      description: 产线名称，模糊匹配。用户说"乳化线"就传"乳化"，"手工线"就传"手工线"

when_to_use:
  - 用户问某条产线的情况，如"乳化线怎么样""3号手工线概况"
  - 用户想了解某条产线的配方，如"这条线有几个配方""称量线做哪些产品"
  - 用户想看某条产线的最近工单，如"1号自动线最近的班次"
  - 管理层巡查产线，如"5号软管线什么情况"

when_not_to_use:
  - 用户想看全局/全厂概况 → 使用 mes.dashboard
  - 用户想看具体工单详情 → 使用 mes.order.profile
  - 用户想对比多条产线的趋势 → 使用 mes.trend

examples:
  - query: "乳化线怎么样"
    arguments:
      lineName: "乳化"
  - query: "3号手工线概况"
    arguments:
      lineCode: "3202"
