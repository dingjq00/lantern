# MES 单条产线概览 — 产线画像（非工单 search）
name: mes.line.overview
description: >
  获取单条产线的静态画像：编号/名称/别名、关联配方数量。
  不含可筛选的生产工单列表；问「该产线多少工单/是否积压/执行中」必须用 mes.order.search。
version: "1.0"
system: mes
type: simple
maps_to: mes.line.overview

domains:
  - production

operation: overview

input_schema:
  properties:
    lineCode:
      type: string
      description: 产线编号，如"3101""3201""3110"
    lineName:
      type: string
      description: 产线名称，模糊匹配。用户说"乳化线"就传"乳化"，"手工线"就传"手工线"

when_to_use:
  - 用户问某条产线的基本情况，如"乳化线怎么样""3号手工线概况"
  - 用户想了解某条产线关联的配方数量，如"这条线有几个配方"

when_not_to_use:
  - ⚠️ 工单数量/状态/积压/执行中/「该产线工单」→ **mes.order.search**（本工具无工单过滤能力）
  - 用户想看全厂概况 → mes.dashboard
  - 用户想看具体工单详情 → mes.order.profile
  - 用户想看产线产量或工单趋势 → mes.trend
  - 跨系统问产线工单是否受影响 → 禁止 line.overview + dashboard 组合代替，须 mes.order.search

examples:
  - query: "乳化线怎么样"
    arguments:
      lineName: "乳化"
  - query: "3号手工线概况"
    arguments:
      lineCode: "3202"
