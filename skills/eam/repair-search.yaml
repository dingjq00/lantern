# eam.repair.search — 维修工单搜索（中等丰富度）
# Tier 2 Search Tool: 搜索维修工单，返回列表级信息 + 备件/工时/知识摘要
# 维修工单是 EAM 最复杂的实体之一，search 返回中等丰富度，profile 返回完整档案

name: eam.repair.search
description: >
  按条件搜索维修工单列表，返回中等丰富度信息：工单基础信息 + 备件费用汇总 +
  工时汇总 + 关联知识标题。支持按设备、产线、部门、工单状态、维修类型、时间范围过滤。
  适用场景：查看维修工单列表、统计维修费用、按类型分析维修分布。
  需要单个工单的完整明细（备件清单、工时日志、全部知识引用）请用 eam.repair.profile。
version: "1.0"
system: eam
type: simple
maps_to: eam.repair.search
domains:
  - repair
operation: search

input_schema:
  properties:
    equipment:
      type: string
      description: >
        设备名称、设备编号或设备ID。支持智能解析。
        用户说"CNC-001的维修记录"就传"CNC-001"。
    productionLine:
      type: string
      description: >
        产线名称或ID。通过产线→设备→维修工单的关联链过滤。
    department:
      type: string
      description: >
        部门/车间名称或ID。通过部门→设备→维修工单的关联链过滤。
    status:
      type: integer
      description: >
        工单状态码。0=待分配 1=待接单 2=维修中 3=挂起 4=待验收 5=已完成 6=已关闭。
        用户说"进行中的维修"通常指0+1+2（建议分别查询或不传status），
        "已完成的维修"传5。
      enum: [0, 1, 2, 3, 4, 5, 6]
    orderType:
      type: string
      description: >
        维修类型。INTERNAL=内修（自有团队），EXTERNAL=外协（外包供应商），CORRECTIVE=纠正性维修。
        用户说"外协维修"传EXTERNAL，"内部维修"传INTERNAL。
      enum: [INTERNAL, EXTERNAL, CORRECTIVE]
    dateRange:
      type: object
      description: >
        时间范围过滤（工单创建时间），格式 {from: "ISO日期", to: "ISO日期"}。
        用户说"上月维修""最近三个月的维修工单"时计算日期范围传入。
    groupBy:
      type: string
      description: >
        按维度聚合统计。
        equipment=按设备统计维修次数（找维修高频设备），
        orderType=按维修类型分布（内修vs外协比例），
        status=按状态分布。
      enum: [equipment, orderType, status]
    format:
      type: string
      description: >
        返回格式。detailed=丰富化信息（前10条附带备件费用汇总+知识引用标题），
        concise=仅工单编号+状态+类型+费用数字。
        注意：detailed 模式为控制API调用量只丰富化前10条。
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - equipment
  - productionLine
  - department
  - status
  - orderType
  - dateRange
  - groupBy

returns:
  - repair_order_list
  - repair_order_count
  - spare_cost_summary
  - workload_summary
  - knowledge_ref_titles
  - group_statistics

feeds_into:
  - eam.repair.profile
  - eam.spare.search

depends_on: []

quality: 85
cost: medium

when_to_use: |
  - 用户查看维修工单列表，如"上月维修工单有哪些""最近的维修记录"
  - 用户按维修类型筛选，如"外协维修有多少""内修和外协的比例"
  - 用户想了解维修费用概况，如"这个月维修花了多少钱"（search 返回每单的费用汇总）
  - 用户按设备/产线查维修情况，如"A线的维修工单""CNC-001修了几次"
  - 用户想找维修高频设备，如"哪台设备维修最多"（groupBy=equipment）

when_not_to_use: |
  - 用户要看某个具体工单的完整详情（备件清单、工时明细、出库记录） → 用 eam.repair.profile
  - 用户要看某台设备的全貌（不只是维修，还有故障+保养+巡检） → 用 eam.equipment.profile
  - 用户要看维修数量/费用的时间趋势 → 用 eam.trend

examples:
  - query: "上个月的维修工单有哪些？"
    arguments:
      dateRange:
        from: "2026-02-01"
        to: "2026-02-28"
      format: concise
  - query: "A线外协维修有多少？"
    arguments:
      productionLine: "A线"
      orderType: EXTERNAL
  - query: "按设备统计维修次数，找出维修最多的设备"
    arguments:
      groupBy: equipment
