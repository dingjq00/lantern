# eam.fault.search — 故障报修搜索
# Tier 2 Search Tool: 按设备/产线/部门/状态/紧急度/时间搜索故障报修记录
# 故障是 EAM 的核心事件流，故障→维修 是最重要的业务链条

name: eam.fault.search
description: >
  按条件搜索故障报修列表，支持按设备、产线、部门、故障状态、紧急程度、故障类型、
  时间范围过滤，可按维度聚合统计。
  适用场景：查看某设备/产线/时段的故障记录、统计故障紧急度分布、排查高频故障设备。
  不返回维修工单详情（关联维修工单请用 eam.repair.search 或 eam.repair.profile）。
version: "1.0"
system: eam
type: simple
maps_to: eam.fault.search
domains:
  - fault
operation: search

input_schema:
  properties:
    equipment:
      type: string
      description: >
        设备名称、设备编号或设备ID。支持智能解析：传"EQ-A301-001"或"薄膜包衣机 #1"均可。
        匹配到多个设备时返回候选列表供用户确认。
    productionLine:
      type: string
      description: >
        产线名称或ID。通过产线→设备→故障的关联链过滤。
        用户说"压片线的故障"就传"压片线"。
    department:
      type: string
      description: >
        部门/车间名称或ID。通过部门→设备→故障的关联链过滤。
    status:
      type: integer
      description: >
        故障状态码。0=待审核 1=待接单 2=维修中 3=挂起 4=待验收 5=已完成 6=已关闭 7=已拒绝 8=已撤回。
        用户说"未处理的故障"通常指0+1（需两次调用或不传status拉全量后分析），
        "维修中的故障"传2，"已完成的故障"传5。
      enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    urgency:
      type: integer
      description: >
        紧急程度。0=一般 1=紧急 2=特急。
        用户说"紧急故障"传1，"特急故障"传2，"一般故障"传0。
      enum: [0, 1, 2]
    faultType:
      type: string
      description: >
        故障类型/分类。用于按故障类型过滤，如"机械故障""电气故障"。
    dateRange:
      type: object
      description: >
        时间范围过滤（故障上报时间），格式 {from: "ISO日期", to: "ISO日期"}。
        用户说"上月故障""最近一周的故障"时计算对应日期范围传入。
    groupBy:
      type: string
      description: >
        按维度聚合统计，返回每组的故障数量而非故障列表。
        equipment=按设备统计（找高频故障设备），status=按状态分布，urgency=按紧急度分布。
        用户说"哪台设备故障最多"传equipment，"故障紧急度分布"传urgency。
      enum: [equipment, status, urgency]
    format:
      type: string
      description: "返回格式。detailed=完整字段（含故障描述、上报时间），concise=仅编号+状态+紧急度"
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - equipment
  - productionLine
  - department
  - status
  - urgency
  - faultType
  - dateRange
  - groupBy

returns:
  - fault_list
  - fault_count
  - group_statistics

feeds_into:
  - eam.repair.search
  - eam.repair.profile
  - eam.equipment.profile

depends_on: []

quality: 85
cost: low

when_to_use: |
  - 用户查看故障列表或故障数量，如"上月有多少故障""最近一周的故障记录"
  - 用户按设备/产线查故障，如"EQ-A301-001的故障记录""压片线故障情况"
  - 用户关注紧急故障，如"有哪些特急故障""紧急故障有多少"
  - 用户想统计故障分布，如"哪台设备故障最多""各状态故障数量"
  - 用户排查故障趋势的当期数据，如"这个月待处理的故障"

when_not_to_use: |
  - 用户想看故障关联的维修工单详情 → 用 eam.repair.search 或 eam.repair.profile
  - 用户想看某台设备的完整档案（含故障+维修+保养全貌） → 用 eam.equipment.profile
  - 用户要看故障数量的时间趋势（按天/周/月） → 用 eam.trend

examples:
  - query: "上个月压片线有多少故障？"
    arguments:
      productionLine: "压片线"
      dateRange:
        from: "2026-02-01"
        to: "2026-02-28"
  - query: "目前有哪些紧急和特急故障未处理？"
    arguments:
      urgency: 1
      status: 0
      format: concise
  - query: "哪台设备故障最多？按设备统计一下"
    arguments:
      groupBy: equipment
