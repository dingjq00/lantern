# eam.patrol.search — 巡检任务搜索
# Tier 2 Search Tool: 搜索巡检任务，返回异常项/总检查项统计
# 巡检是发现异常的入口，巡检→异常→故障 是重要的事件链

name: eam.patrol.search
description: >
  按条件搜索巡检任务列表，每条任务返回总检查项数、已完成项数、异常项数。
  支持按设备、产线、部门、状态、时间范围过滤。
  特殊行为：按设备过滤时使用专用 equipment-records 端点（巡检任务通过计划间接关联设备，
  不像故障/维修有直接 equipmentId），返回该设备的巡检执行记录而非任务列表。
  适用场景：查看巡检完成情况、找出有异常的巡检、统计巡检覆盖率。
version: "1.0"
system: eam
type: simple
maps_to: eam.patrol.search
domains:
  - patrol
operation: search

input_schema:
  properties:
    equipment:
      type: string
      description: >
        设备名称、设备编号或设备ID。支持智能解析。
        注意：巡检任务不直接关联设备，传设备参数时会自动使用 equipment-records 端点，
        返回的是该设备的巡检记录而非标准任务列表格式。
    productionLine:
      type: string
      description: >
        产线名称或ID。通过分析端点间接过滤。
        注意：巡检任务按产线/部门过滤的实现较间接，可能通过 analytics 端点返回聚合数据。
    department:
      type: string
      description: >
        部门/车间名称或ID。间接过滤方式同产线。
    status:
      type: integer
      description: >
        巡检任务状态码。具体值参考系统定义。
        用户说"未完成的巡检"通常需要按状态筛选。
    dateRange:
      type: object
      description: >
        时间范围过滤（计划执行时间），格式 {from: "ISO日期", to: "ISO日期"}。
        用户说"本周巡检""上月巡检完成情况"时计算日期范围传入。
    groupBy:
      type: string
      description: >
        按维度聚合统计。
        equipment=按设备统计巡检情况（注意：巡检任务通过计划关联设备，此处按 planId 分组），
        status=按状态分布。
      enum: [equipment, status]
    format:
      type: string
      description: >
        返回格式。detailed=完整字段（含检查项数、异常项数、计划时间、完成时间），
        concise=仅编号+状态+异常数/总数。
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - equipment
  - productionLine
  - department
  - status
  - dateRange
  - groupBy

returns:
  - patrol_task_list
  - patrol_task_count
  - total_items
  - completed_items
  - abnormal_items
  - equipment_records

feeds_into:
  - eam.anomaly.search
  - eam.equipment.profile

depends_on: []

quality: 80
cost: low

when_to_use: |
  - 用户查看巡检完成情况，如"巡检任务完成了多少""本周巡检执行情况"
  - 用户关注巡检异常，如"有多少巡检异常""哪些巡检发现了问题"
  - 用户查某台设备的巡检记录，如"CNC-001的巡检记录""这台设备最近巡检了吗"
  - 用户统计巡检覆盖率或按状态分布，如"巡检各状态数量"

when_not_to_use: |
  - 用户要看巡检中发现的异常的详细记录 → 用 eam.anomaly.search（异常是独立记录）
  - 用户想看某台设备的完整档案（含巡检+故障+维修） → 用 eam.equipment.profile
  - 用户要看巡检数量的时间趋势 → 用 eam.trend

examples:
  - query: "CNC-001最近的巡检记录"
    arguments:
      equipment: "CNC-001"
  - query: "本周有多少巡检任务发现了异常？"
    arguments:
      dateRange:
        from: "2026-03-23"
        to: "2026-03-28"
      format: concise
  - query: "巡检任务各状态数量统计"
    arguments:
      groupBy: status
