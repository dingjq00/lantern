# eam.equipment.search — 设备列表搜索
# Tier 2 Search Tool: 按多维条件过滤设备，支持 groupBy 聚合统计
# 设备是 EAM 的引力中心，几乎所有搜索的起点

name: eam.equipment.search
description: >
  按条件搜索设备列表，支持按状态、分类、产线、部门、位置、重点设备过滤，
  可按维度聚合统计（设备数量分布）。
  适用场景：查看某个范围内有哪些设备、统计各状态设备数量、筛选重点设备清单。
  不适合查看单台设备的完整档案（用 eam.equipment.profile）。
version: "1.0"
system: eam
type: simple
maps_to: eam.equipment.search
domains:
  - equipment
operation: search

input_schema:
  properties:
    status:
      type: integer
      description: >
        设备状态码。0=待验收 1=运行中 2=维修中 3=停机 4=封存 5=待整改 6=闲置 7=报废 8=其他。
        用户说"运行中的设备"传1，"报废设备"传7，"停机的"传3。
      enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    category:
      type: string
      description: >
        设备分类名称或ID。支持智能解析：传分类名称（如"注塑机""CNC"）或分类ID均可。
        用户说"注塑机有多少台"就传"注塑机"。
    productionLine:
      type: string
      description: >
        产线名称或ID。支持智能解析：传产线名称（如"压片线""1号线"）或产线ID均可。
        匹配到多个产线时返回候选列表供确认。
    department:
      type: string
      description: >
        部门或车间名称/ID。支持智能解析。
        用户说"一车间的设备"就传"一车间"。
    location:
      type: string
      description: >
        安装位置名称或ID。用于精确到具体区域的设备筛选。
    isKey:
      type: boolean
      description: >
        是否仅查重点设备。true=只返回重点设备，不传则不做此过滤。
        用户说"重点设备""关键设备"时传true。
    dateRange:
      type: object
      description: >
        时间范围过滤（设备创建/投用时间），格式 {from: "ISO日期", to: "ISO日期"}。
        用户说"上月新增设备"时计算上月的日期范围传入。
    groupBy:
      type: string
      description: >
        按维度聚合统计，返回每组的设备数量而非设备列表。
        status=按状态分布，category=按分类分布，department=按部门分布。
        用户说"各状态设备数量"传status，"各车间设备数"传department。
      enum: [status, category, department]
    format:
      type: string
      description: "返回格式。detailed=完整字段（含ID、型号、制造商），concise=仅编号+名称+状态"
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - status
  - category
  - productionLine
  - department
  - location
  - isKey
  - dateRange
  - groupBy

returns:
  - equipment_list
  - equipment_count
  - group_statistics

feeds_into:
  - eam.equipment.profile
  - eam.fault.search
  - eam.repair.search

depends_on: []

quality: 85
cost: low

when_to_use: |
  - 用户想查看符合条件的设备列表，如"维修中的设备有哪些""压片线有多少设备"
  - 用户按设备运行状态筛选，如"正在维修的设备""停机的设备""运行中的设备"→ 用 status 参数
  - 用户想要设备的统计分布，如"各状态设备数量""按部门统计设备"
  - 用户想筛选重点设备，如"重点设备清单""关键设备有哪些"
  - 用户按产线或车间范围查看设备，如"一车间有哪些设备""B线的闲置设备"
  - 用户问某个分类下的设备情况，如"注塑机有多少台""CNC设备列表"

when_not_to_use: |
  - 用户要查看某台具体设备的完整档案（故障历史、维修记录、保养计划等） → 用 eam.equipment.profile
  - 用户要看全局设备概览/仪表盘数字 → 用 eam.dashboard
  - 用户要看某个范围的综合画像（含设备+故障+维修等多域汇总） → 用 eam.scope.overview

examples:
  - query: "维修中的设备有哪些？"
    arguments:
      status: 2
      format: concise
  - query: "压片线各状态设备数量统计"
    arguments:
      productionLine: "压片线"
      groupBy: status
  - query: "一车间的重点设备清单"
    arguments:
      department: "一车间"
      isKey: true
      format: detailed
