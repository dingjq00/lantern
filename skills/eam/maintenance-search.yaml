# eam.maintenance.search — 保养任务搜索
# Tier 2 Search Tool: 搜索保养任务，支持逾期筛选，groupBy 返回完成率
# 保养是预防性维护的核心，完成率和逾期率是关键 KPI

name: eam.maintenance.search
description: >
  按条件搜索保养任务列表，支持按设备、产线、部门、状态、时间范围过滤，
  可单独筛选逾期任务。groupBy 聚合时额外返回每组的完成率（completed/total）。
  适用场景：查看保养执行情况、筛选逾期未做的保养、统计各设备/状态的保养完成率。
  保养任务由保养计划自动生成，本工具搜索的是已生成的任务实例。
version: "1.0"
system: eam
type: simple
maps_to: eam.maintenance.search
domains:
  - maintenance
operation: search

input_schema:
  properties:
    equipment:
      type: string
      description: >
        设备名称、设备编号或设备ID。支持智能解析。
        用户说"CNC-001的保养任务"就传"CNC-001"。
    productionLine:
      type: string
      description: >
        产线名称或ID。通过产线→设备→保养任务的关联链过滤。
    department:
      type: string
      description: >
        部门/车间名称或ID。通过部门→设备→保养任务的关联链过滤。
    status:
      type: integer
      description: >
        保养任务状态码。0=待执行 1=执行中 2=已完成 3=已逾期 4=已跳过。
        用户说"待做的保养"传0，"逾期的保养"传3，"跳过的保养"传4。
        注意：overdue=true 等价于 status=3，两者不要同时传。
      enum: [0, 1, 2, 3, 4]
    overdue:
      type: boolean
      description: >
        仅筛选逾期任务，等价于 status=3。
        用户说"逾期保养""超期未做的保养"时传true。
        这是一个语义化快捷参数，方便 AI 路由。
    dateRange:
      type: object
      description: >
        时间范围过滤（计划执行时间），格式 {from: "ISO日期", to: "ISO日期"}。
        用户说"本月的保养任务""上周保养"时计算日期范围传入。
    groupBy:
      type: string
      description: >
        按维度聚合统计，返回每组的任务总数 + 已完成数 + 完成率。
        equipment=按设备统计保养完成率，status=按状态统计分布。
        用户说"各设备保养完成率"传equipment，"保养各状态数量"传status。
      enum: [equipment, status]
    format:
      type: string
      description: "返回格式。detailed=完整字段（含计划时间、执行时间、跳过原因），concise=仅编号+状态+设备+计划时间"
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - equipment
  - productionLine
  - department
  - status
  - overdue
  - dateRange
  - groupBy

returns:
  - maintenance_task_list
  - maintenance_task_count
  - completion_rate
  - group_statistics_with_rate

feeds_into:
  - eam.equipment.profile

depends_on: []

quality: 85
cost: low

when_to_use: |
  - 用户查看保养任务列表，如"本月保养任务有哪些""待执行的保养"
  - 用户关注逾期保养，如"有哪些逾期保养""超期未做的保养任务"
  - 用户想看保养完成率/执行率/排名，如"A线保养完成率多少""各产线保养完成率排名""保养执行率是多少"
  - 用户按设备查保养记录，如"CNC-001的保养情况""这台设备保养做了吗"
  - 用户统计保养状态分布，如"保养任务各状态数量"

when_not_to_use: |
  - 用户想看某台设备的全貌（保养只是其中一部分） → 用 eam.equipment.profile
  - 用户要看保养计划（而非已生成的任务）→ 当前没有直接搜索保养计划的工具
  - 用户要看保养完成率的时间趋势 → 用 eam.trend

examples:
  - query: "有哪些逾期未做的保养任务？"
    arguments:
      overdue: true
      format: concise
  - query: "A线各设备保养完成率是多少？"
    arguments:
      productionLine: "A线"
      groupBy: equipment
  - query: "上个月一车间的保养执行情况"
    arguments:
      department: "一车间"
      dateRange:
        from: "2026-02-01"
        to: "2026-02-28"
