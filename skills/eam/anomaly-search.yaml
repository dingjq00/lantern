# eam.anomaly.search — 异常记录搜索
# Tier 2 Search Tool: 搜索异常记录，含严重度、来源、是否已升级为故障
# 异常是巡检/点检/检测的产出物，可升级为故障报修单

name: eam.anomaly.search
description: >
  按条件搜索异常记录列表，支持按设备、产线、部门、严重度、异常来源、时间范围过滤。
  每条记录标注是否已升级为故障报修单（escalated + faultReportId）。
  异常来源包括：巡检发现、点检发现、检测发现、人工上报。
  适用场景：查看异常记录、按严重度筛选、追踪异常处理闭环（是否转为故障单）、
  按来源分析异常发现渠道。
version: "1.0"
system: eam
type: simple
maps_to: eam.anomaly.search
domains:
  - anomaly
operation: search

input_schema:
  properties:
    equipment:
      type: string
      description: >
        设备名称、设备编号或设备ID。支持智能解析。
        用户说"EQ-A301-001的异常记录"就传"EQ-A301-001"。
    productionLine:
      type: string
      description: >
        产线名称或ID。通过产线→设备→异常的关联链过滤。
    department:
      type: string
      description: >
        部门/车间名称或ID。通过部门→设备→异常的关联链过滤。
    severity:
      type: integer
      description: >
        异常严重度。1=低 2=中 3=高 4=紧急。
        用户说"严重异常"通常指3+4，"紧急异常"传4，"一般异常"传1或2。
        注意：只能传单个值，如需同时查高+紧急需两次调用或不传severity后分析。
      enum: [1, 2, 3, 4]
    source:
      type: string
      description: >
        异常来源。PATROL=巡检发现，SPOT_CHECK=点检发现，INSPECTION=检测发现，MANUAL=人工上报。
        用户说"巡检发现的异常"传PATROL，"手动上报的异常"传MANUAL。
      enum: [PATROL, SPOT_CHECK, INSPECTION, MANUAL]
    dateRange:
      type: object
      description: >
        时间范围过滤（异常创建时间），格式 {from: "ISO日期", to: "ISO日期"}。
    groupBy:
      type: string
      description: >
        按维度聚合统计。
        equipment=按设备统计异常数（找异常高发设备），
        severity=按严重度分布（了解异常等级结构），
        source=按来源分布（评估各发现渠道贡献）。
      enum: [equipment, severity, source]
    format:
      type: string
      description: >
        返回格式。detailed=完整字段（含描述、来源、严重度、是否升级、关联故障单ID），
        concise=仅ID+严重度+来源+是否已升级。
      enum: [detailed, concise]
      default: detailed
    sortBy:
      type: string
      description: "排序字段"
    sortOrder:
      type: string
      description: "排序方向"
      enum: [asc, desc]
    limit:
      type: integer
      description: "返回条数上限，默认20"
      default: 20

supports_filters:
  - equipment
  - productionLine
  - department
  - severity
  - source
  - dateRange
  - groupBy

returns:
  - anomaly_list
  - anomaly_count
  - escalation_status
  - fault_report_id
  - group_statistics

feeds_into:
  - eam.fault.search
  - eam.equipment.profile

depends_on: []

quality: 85
cost: low

when_to_use: |
  - 用户查看异常记录，如"最近有哪些异常""本月异常记录"
  - 用户按严重度筛选，如"严重异常有哪些""紧急异常记录"
  - 用户想知道异常来源分布，如"巡检发现了多少异常""各渠道发现的异常占比"
  - 用户追踪异常闭环，如"有多少异常已经转为故障单""未处理的异常"
  - 用户找异常高发设备，如"哪台设备异常最多"（groupBy=equipment）
  - 跨域分析中需要异常/巡检数据时：如"某设备有没有发现过异常""巡检有没有发现问题"

when_not_to_use: |
  - 用户想看故障报修单的详情（异常升级后变成故障单） → 用 eam.fault.search
  - 用户想看巡检任务本身的完成情况（不是巡检发现的异常） → 用 eam.patrol.search
  - 用户要看异常数量的时间趋势 → 用 eam.trend

examples:
  - query: "巡检发现的高严重度异常有哪些？"
    arguments:
      source: PATROL
      severity: 3
  - query: "按严重度统计异常分布"
    arguments:
      groupBy: severity
  - query: "压片线上个月有多少异常已经转为故障单？"
    arguments:
      productionLine: "压片线"
      dateRange:
        from: "2026-02-01"
        to: "2026-02-28"
      format: detailed
