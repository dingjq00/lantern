name: get_spare_stock
description: 查询备件的库存数量和安全库存。get_equipment_spare_bom 返回设备需要哪些备件，但不含库存数量，需要本工具查库存是否充足。
version: "1.0"
system: eam
domains: [spare]
operation: detail
supports_filters: [spareId, warehouseId]
returns: [spareId, spareName, warehouseId, warehouseName, quantity, safetyStock]
feeds_into: []
depends_on: [query_spare_parts]
quality: 5
cost: low
input_schema:
  type: object
  properties:
    spareId:
      type: integer
      description: 备件ID（按备件查库存）
    warehouseId:
      type: integer
      description: 仓库ID（按仓库查库存）
examples:
  - query: 轴承的库存还有多少？
    arguments: { spareId: 401 }
when_to_use: 需要查询特定备件库存或仓库库存时
when_not_to_use: 需要查库存预警用 get_spare_alerts
