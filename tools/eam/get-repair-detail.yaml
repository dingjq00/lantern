name: get_repair_detail
description: 获取维修工单的备件清单、工时记录、知识引用等完整详情。query_repair_orders 只返回工单列表（编号/状态/时间），不含备件和工时，需要本工具补全。
version: "1.0"
system: eam
domains: [fault-repair, spare, knowledge]
operation: detail
supports_filters: [repairOrderId, faultReportId]
returns: [repairOrder, sparesUsed, laborRecords, knowledgeRefs]
feeds_into: [get_equipment_spare_bom, query_spare_transactions]
depends_on: [query_repair_orders, query_fault_reports]
quality: 5
cost: low
input_schema:
  type: object
  properties:
    repairOrderId:
      type: integer
      description: 维修工单ID
    faultReportId:
      type: integer
      description: 故障报修ID（二选一，通过报修单找工单）
examples:
  - query: 工单 WO-001 用了哪些备件？
    arguments: { repairOrderId: 201 }
  - query: 这次报修的维修详情
    arguments: { faultReportId: 301 }
when_to_use: 维修工单的备件/工时/知识/成本详情；"用了哪些备件""花了多少工时""维修费用"
when_not_to_use: 只要工单列表用 query_repair_orders
