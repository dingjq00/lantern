name: get_patrol_analytics
description: 获取巡检综合分析数据。支持按不同维度（整体/按计划/按设备/按检查标准）统计巡检完成率、异常率等指标。
version: "1.0"
system: eam
domains: [patrol]
operation: statistics
supports_filters: [days, dimension]
returns: [completionRate, anomalyRate, dimensionData]
feeds_into: []
depends_on: []
quality: 5
cost: medium
input_schema:
  type: object
  properties:
    days:
      type: integer
      default: 30
      description: 统计天数
    dimension:
      type: string
      enum: [overview, by_plan, by_equipment, by_standard]
      default: overview
      description: 统计维度
examples:
  - query: 近30天巡检完成率多少？
    arguments: { days: 30, dimension: overview }
  - query: 各设备的巡检异常率
    arguments: { dimension: by_equipment }
when_to_use: 需要巡检统计分析、完成率/异常率指标时
when_not_to_use: 需要具体巡检任务列表用 query_patrol_tasks
