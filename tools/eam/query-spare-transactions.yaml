name: query_spare_transactions
description: 查询备件流转记录，包括入库、出库、调拨、归还、报废等各类单据。
version: "1.0"
system: eam
domains: [spare]
operation: list
supports_filters: [type, spareId, dateRange]
returns: [transactionId, type, spareName, quantity, warehouseName, createdAt]
feeds_into: []
depends_on: []
quality: 3
cost: low
input_schema:
  type: object
  properties:
    type:
      type: string
      enum: [stock_in, stock_out, transfer, return, scrap, purchase]
      description: 单据类型
    spareId:
      type: integer
      description: 备件ID（查指定备件的出入库明细）
    dateRange:
      type: object
      properties:
        start:
          type: string
          format: date
          description: 开始日期
        end:
          type: string
          format: date
          description: 结束日期
examples:
  - query: 上月备件出库记录
    arguments: { type: "stock_out", dateRange: { start: "2026-02-01", end: "2026-02-28" } }
when_to_use: 需要查备件出入库流水、追踪备件流转时
when_not_to_use: 需要查维修工单用了哪些备件用 get_repair_detail
