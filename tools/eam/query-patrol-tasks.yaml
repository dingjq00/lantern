name: query_patrol_tasks
description: 查询巡检任务列表。支持按设备、状态、巡检计划、时间范围筛选。
version: "1.0"
system: eam
domains: [patrol]
operation: list
supports_filters: [equipmentId, status, planId, dateRange]
returns: [taskId, equipmentName, planName, status, scheduledDate, completedDate]
feeds_into: []
depends_on: []
quality: 5
cost: low
input_schema:
  type: object
  properties:
    equipmentId:
      type: integer
      description: 设备ID
    status:
      type: integer
      description: 任务状态
    planId:
      type: integer
      description: 巡检计划ID
    dateRange:
      type: object
      properties:
        start:
          type: string
          format: date
          description: 开始日期
        end:
          type: string
          format: date
          description: 结束日期
examples:
  - query: 本周的巡检任务完成情况
    arguments: { dateRange: { start: "2026-03-23", end: "2026-03-29" } }
when_to_use: 需要查询巡检任务列表时
when_not_to_use: 需要巡检统计分析用 get_patrol_analytics
