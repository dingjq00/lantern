name: get_todo_list
description: 获取当前待办事项列表，包括待审核报修、待接单工单、待执行保养任务。
version: "1.0"
system: eam
domains: [fault-repair, maintenance]
operation: list
supports_filters: []
returns: [pendingFaults, pendingOrders, pendingMaintenance]
feeds_into: [query_fault_reports, query_repair_orders, query_maintenance_tasks]
depends_on: []
quality: 5
cost: low
input_schema:
  type: object
  properties: {}
examples:
  - query: 我今天有什么待办？
    arguments: {}
when_to_use: 需要查看当前所有待处理事项时
when_not_to_use: 需要特定类型的待办列表用各自的 query 工具带 status 筛选
