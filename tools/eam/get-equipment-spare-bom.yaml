name: get_equipment_spare_bom
description: 查询设备与备件的BOM关联关系。可正向查设备的备件清单，也可反向查备件适用的设备。
version: "1.0"
system: eam
domains: [equipment, spare]
operation: detail
supports_filters: [equipmentId, spareId]
returns: [equipmentId, equipmentName, spareId, spareName, quantity]
feeds_into: [get_spare_stock]
depends_on: [query_equipment, query_spare_parts]
quality: 5
cost: low
input_schema:
  type: object
  properties:
    equipmentId:
      type: integer
      description: 设备ID（查设备的备件BOM清单）
    spareId:
      type: integer
      description: 备件ID（查备件关联的设备清单）
examples:
  - query: CNC-001 需要哪些备件？
    arguments: { equipmentId: 101 }
  - query: 这个轴承用在哪些设备上？
    arguments: { spareId: 401 }
when_to_use: 查设备需要哪些备件（正向：设备→备件清单）；查备件用在哪些设备上（反向：备件→设备清单）；查设备的 BOM 关联关系；判断备件库存不足会影响哪些设备
when_not_to_use: 查备件具体库存数量用 get_spare_stock；查备件基本信息用 query_spare_parts
