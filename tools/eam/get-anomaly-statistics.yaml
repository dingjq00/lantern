name: get_anomaly_statistics
description: 获取异常统计KPI，包括总数、待处理数、处理率、各严重级别分布等。
version: "1.0"
system: eam
domains: [patrol, maintenance]
operation: statistics
supports_filters: []
returns: [totalCount, pendingCount, processRate, severityDistribution]
feeds_into: []
depends_on: []
quality: 5
cost: low
input_schema:
  type: object
  properties: {}
examples:
  - query: 异常处理率是多少？
    arguments: {}
when_to_use: 需要异常统计概览、KPI指标时
when_not_to_use: 需要具体异常记录列表用 query_anomaly_records
