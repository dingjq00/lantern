name: get_equipment_lifecycle
description: 获取设备全生命周期时间线事件，包括购置、验收、状态变更、故障、维修、保养、变动等所有历史事件。
version: "1.0"
system: eam
domains: [equipment]
operation: detail
supports_filters: [equipmentId]
returns: [events]
feeds_into: []
depends_on: [query_equipment]
quality: 3
cost: medium
input_schema:
  type: object
  properties:
    equipmentId:
      type: integer
      description: 设备ID
  required: [equipmentId]
examples:
  - query: CNC-001 从购置到现在经历了什么？
    arguments: { equipmentId: 101 }
when_to_use: 需要查看设备完整历史时间线时
when_not_to_use: 只需要当前状态用 get_equipment_detail
