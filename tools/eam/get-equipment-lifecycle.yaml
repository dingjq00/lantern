name: get_equipment_lifecycle
description: 获取设备全生命周期时间线事件，包括购置、验收、状态变更、故障、维修、保养、变动等所有历史事件。
version: "1.0"
system: eam
domains: [equipment]
operation: detail
supports_filters: [equipmentId]
returns: [events]
feeds_into: []
depends_on: [query_equipment]
quality: 3
cost: medium
input_schema:
  type: object
  properties:
    equipmentId:
      type: integer
      description: 设备ID
  required: [equipmentId]
examples:
  - query: CNC-001 从购置到现在经历了什么？
    arguments: { equipmentId: 101 }
when_to_use: 查看设备的全生命周期事件/历史时间线；查设备经历了什么（购置、验收、故障、维修、保养、变动等所有历史事件）
when_not_to_use: 只需要设备当前状态和 KPI 用 get_equipment_detail；只需要设备列表用 query_equipment
