name: aggregate_data
description: 对任意数据源做聚合统计。支持分组计数、求和、求均值、排序、Top-N。当需要统计"哪个最多""分布情况""排名"等聚合类问题，且没有专用统计工具时使用。
version: "1.0"
system: eam
domains: [equipment, fault-repair, maintenance, patrol, spare]
operation: statistics
supports_filters: [source, groupBy, operation, sortBy, limit, dateRange]
returns: [aggregatedData]
feeds_into: []
depends_on: []
quality: 5
cost: medium
input_schema:
  type: object
  properties:
    source:
      type: string
      enum: [equipment, fault_reports, repair_orders, maintenance_tasks, patrol_tasks, anomaly_records, spare_parts, spare_transactions]
      description: 数据源（对应系统中的数据实体）
    groupBy:
      type: string
      description: "分组字段，如: category, status, productionLine, faultType, equipmentId, source, severity"
    operation:
      type: string
      enum: [count, sum, avg, max, min]
      default: count
      description: 聚合操作
    valueField:
      type: string
      description: 聚合目标字段（sum/avg/max/min 时必填，count 时可省略）
    sortBy:
      type: string
      enum: [value_desc, value_asc]
      default: value_desc
      description: 排序方式
    limit:
      type: integer
      description: 返回 Top-N 条（不传则返回全部）
    dateRange:
      type: object
      properties:
        start:
          type: string
          format: date
          description: 开始日期
        end:
          type: string
          format: date
          description: 结束日期
  required: [source, groupBy]
examples:
  - query: 设备分类中哪类设备最多？
    arguments: { source: "equipment", groupBy: "category", operation: "count", sortBy: "value_desc", limit: 5 }
  - query: 各产线的故障次数排名
    arguments: { source: "fault_reports", groupBy: "productionLine", operation: "count", sortBy: "value_desc" }
  - query: 上月各设备的平均维修时长
    arguments: { source: "repair_orders", groupBy: "equipmentId", operation: "avg", valueField: "repairHours", dateRange: { start: "2026-02-01", end: "2026-02-28" } }
when_to_use: 需要分组统计、排名、分布、Top-N 等聚合分析，且没有专用统计工具（如 get_dashboard_summary/get_anomaly_statistics）直接返回结果时
when_not_to_use: 已有专用统计工具能直接回答时（如设备总数用 get_dashboard_summary，异常统计用 get_anomaly_statistics）
