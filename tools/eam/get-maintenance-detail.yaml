name: get_maintenance_detail
description: 获取保养任务详情，包括任务基本信息和执行记录（各检查项的完成情况）。
version: "1.0"
system: eam
domains: [maintenance]
operation: detail
supports_filters: [taskId]
returns: [task, executionRecords]
feeds_into: []
depends_on: [query_maintenance_tasks]
quality: 3
cost: low
input_schema:
  type: object
  properties:
    taskId:
      type: integer
      description: 保养任务ID
  required: [taskId]
examples:
  - query: 这个保养任务的执行明细
    arguments: { taskId: 501 }
when_to_use: 需要查看单个保养任务的详细执行记录时
when_not_to_use: 需要保养任务列表时用 query_maintenance_tasks
