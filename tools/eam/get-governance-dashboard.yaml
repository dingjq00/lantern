name: get_governance_dashboard
description: 获取设备生命周期治理看板，包含设备健康度、数据质量、审计追溯等治理指标。支持时间范围和设备关键字钻取。
version: "1.0"
system: eam
domains: [equipment]
operation: statistics
supports_filters: [startTime, endTime, keyword, drilldown]
returns: [healthScore, dataQualityScore, auditMetrics, deviceDetails]
feeds_into: []
depends_on: []
quality: 3
cost: medium
input_schema:
  type: object
  properties:
    startTime:
      type: string
      format: date-time
      description: 开始时间
    endTime:
      type: string
      format: date-time
      description: 结束时间
    keyword:
      type: string
      description: 设备编号或名称（钻取模式）
    drilldown:
      type: boolean
      default: false
      description: 是否返回设备级明细
examples:
  - query: 设备治理整体情况怎么样？
    arguments: {}
  - query: CNC-001 的治理指标
    arguments: { keyword: "CNC-001", drilldown: true }
when_to_use: 仅用于治理指标查询（健康度、数据质量、审计追溯）
when_not_to_use: 需要运营数据用 get_dashboard_summary；需要故障趋势用 get_fault_trend
