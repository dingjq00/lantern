name: get_dashboard_summary
description: 获取系统总览统计，包括设备总数、运行中/故障/报废数、待处理报修数、待处理工单数、待执行保养任务数。
version: "1.0"
system: eam
domains: [equipment, fault-repair, maintenance]
operation: statistics
supports_filters: []
returns: [totalEquipment, runningCount, faultCount, scrappedCount, pendingFaults, pendingOrders, pendingMaintenance]
feeds_into: []
depends_on: []
quality: 5
cost: low
input_schema:
  type: object
  properties: {}
examples:
  - query: 系统里有多少台设备？
    arguments: {}
  - query: 给我一个全局概览
    arguments: {}
when_to_use: 查系统整体概览（设备总数、运行中/故障/报废数量）；查待处理的报修/工单/保养数量；回答"有多少"类的全局统计问题
when_not_to_use: 查各状态设备的具体分布用 get_equipment_status_distribution；查治理指标用 get_governance_dashboard；查待办事项明细用 get_todo_list
