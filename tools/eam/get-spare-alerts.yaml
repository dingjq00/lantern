name: get_spare_alerts
description: 查询库存预警信息，返回库存低于安全线的备件列表。
version: "1.0"
system: eam
domains: [spare]
operation: alert
supports_filters: []
returns: [spareId, spareName, currentStock, safetyStock, shortage]
feeds_into: [get_equipment_spare_bom]
depends_on: []
quality: 5
cost: low
input_schema:
  type: object
  properties: {}
examples:
  - query: 有哪些备件库存不足？
    arguments: {}
when_to_use: 需要查看库存预警、低库存备件时
when_not_to_use: 需要查特定备件库存用 get_spare_stock
